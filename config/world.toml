# The simulated world: fund managers, their funds and investors, the bank and the
# e-mail provider. Nothing in src/app reads this file or src/world.

[timeline]
start = "2023-01-02"
days = 900
tenants = 2
funds_per_tenant = [1, 2]

[fund]
investors_first_close = [10, 26]
subsequent_closes = [1, 3]
investors_per_subsequent_close = [3, 9]
days_between_closes = [60, 150]
increase_probability = 0.15
ticket_euros = [100_000, 12_000_000]
eq_rate_bps = [500, 600, 800]
pref_bps = [700, 800]
carry_bps = [2000, 2000, 2500]
days_between_calls = [55, 140]
call_fraction = [0.03, 0.10]        # of total commitments at the time
first_distribution_day = 420
days_between_distributions = [90, 200]
distribution_fraction = [0.05, 0.45] # of capital called so far

# What investors do with each notice that asks for money.
[behaviour]
on_time = 0.70
reference_in_text = 0.07
no_reference = 0.06
wrong_reference = 0.03
partial = 0.04
late_within_grace = 0.04
very_late = 0.02
overpay = 0.02
other_account = 0.02
# Share of investors who default on one notice and never pay it.
defaulter = 0.03

[bank]
statement_resend = 0.03     # a statement file is delivered twice
noise_credits_per_month = 1 # bank interest, refunds: credits that are no investor's payment
fees_per_month = 1          # debits on the account

[provider]
unavailable = 0.04          # refused; nothing sent
ambiguous_delivered = 0.03  # times out after accepting the message
ambiguous_lost = 0.02       # times out before accepting it
crash_after_send = 0.01     # the service dies after the provider accepted

[documents]
ocr_noise = 0.25
words_missing = 0.10
words_disagree = 0.03
bad_iban = 0.03
misfiled = 0.01
missing_email = 0.02

[requests]
duplicate = 0.15            # the client sends the same request twice at once
