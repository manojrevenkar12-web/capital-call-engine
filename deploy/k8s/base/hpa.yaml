apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capital-call-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capital-call-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
