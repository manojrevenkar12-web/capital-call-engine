apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: capital-call-engine
    includeSelectors: true
resources:
  - serviceaccount.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: capital-call-engine-config
    files:
      - engine.toml=../../../config/engine.toml
