# Database URL (RDS for MySQL, TLS required), the FusionAuth signing secret and the
# SendGrid key come from AWS Secrets Manager through External Secrets Operator.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: capital-call-engine
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: capital-call-engine
  data:
    - secretKey: CCE_DATABASE_URL
      remoteRef: { key: fund-operations/capital-call-engine, property: database_url }
    - secretKey: CCE_JWT_SECRET
      remoteRef: { key: fund-operations/capital-call-engine, property: jwt_secret }
    - secretKey: CCE_SENDGRID_API_KEY
      remoteRef: { key: fund-operations/capital-call-engine, property: sendgrid_api_key }
